spring.application.name=HealthSafe

# In-memory H2 datasource (keeps app bootable now; swap for Postgres/MySQL later)
spring.datasource.url=jdbc:h2:mem:healthsafe;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional: browse the in-memory DB at /h2-console while developing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
